server.port=8085

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

spring.ai.google.genai.chat.temperature=0.7

management.endpoints.web.exposure.include=health,info
eureka.client.enabled=false

# MCP Client - Ticket Service
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.name=ai-service
spring.ai.mcp.client.type=SYNC

#spring.ai.mcp.client.streamable-http.connections.ticket-service.url=http://ticket-service:8082

spring.ai.mcp.client.streamable-http.connections.ticket-service.url=http://localhost:8082

jwt.secret=ThisIsMySuperSecretKeyForJwtAuthentication123456789
jwt.expiration=3600000
