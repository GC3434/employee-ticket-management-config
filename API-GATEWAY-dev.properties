management.tracing.sampling.probability=1.0

management.opentelemetry.tracing.export.otlp.endpoint=http://jaeger:4318/v1/traces

management.otlp.metrics.export.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,threaddump,beans,env

#Eureka Client
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

server.port = 8080
jwt.secret=ThisIsMySuperSecretKeyForJwtAuthentication123456789

logging.level.org.springframework.cloud.gateway=INFO

#spring.cloud.gateway.server.webmvc.routes[0].id=ticket-service
#spring.cloud.gateway.server.webmvc.routes[0].uri=lb://TICKET-SERVICE
#spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/tickets/**

resilience4j.ratelimiter.instances.ticketService.limit-for-period=5
resilience4j.ratelimiter.instances.ticketService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.ticketService.timeout-duration=0

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
