server.port=8082

spring.cloud.openfeign.micrometer.enabled=true

management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

#Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,threaddump,beans

# Circuit Breaker
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
# Retry
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=1s
# Rate Limiter
resilience4j.ratelimiter.instances.ticketService.limit-for-period=5
resilience4j.ratelimiter.instances.ticketService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.ticketService.timeout-duration=0

#Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/empNtkt
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer
spring.kafka.consumer.group-id=ticket-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ugc.EmpMngmntAndTktingSys.kafka.event

spring.kafka.consumer.properties.spring.json.value.default.type=com.ugc.EmpMngmntAndTktingSys.kafka.event.TicketCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka tracing
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

logging.structured.format.console=logstash

jwt.secret=ThisIsMySuperSecretKeyForJwtAuthentication123456789
jwt.expiration=3600000
